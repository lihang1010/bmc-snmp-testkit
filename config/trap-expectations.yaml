# Trap / Inform 触发条件与内容期望
#
# 依据（IPMI 2.0）：
#   §16 Event Messages / §29.7 Event Request Message：EvMRev、Sensor Type、Sensor #、
#       Event Dir|Event Type、Event Data 1..3、Generator ID 构成一个上报事件。
#   §17.1 / §17.11：Alert Policy 决定告警目的端；§17.7 Event Filter Table 的
#       Event Severity 为 00h unspecified / 01h Monitor / 02h Information / 04h OK /
#       08h Non-critical(warning) / 10h Critical / 20h Non-recoverable。
#   §30.7 Alert Immediate：可用于测试告警配置而不会写入事件日志（本框架在模拟 Agent
#       中以内存事件模拟该语义，绝不向真实 BMC 下发状态变更命令）。
#   §30.8 PET Acknowledge：PET 即 SNMP trap，可要求接收端确认（对应 inform 的 ACK）。
#   §31/§32 SEL：事件日志 16 字节标准记录，含 Record ID / Record Type / Timestamp。
#
# 本 MIB 没有 NOTIFICATION-TYPE 定义，故采用「标准 trap OID + 企业 OID + 变量绑定」
# 的约定；企业特定事件上报 OID 约定为 <root>.0.<eventCode>，变量绑定复用 eventLogsTable
# 列（eventLogsEventID / SensorName / SensorType / Description / EventType）承载 IPMI
# 事件字段，严重级别按 §17.7 映射到 snmptrapSeverity 的 info(1)/waring(2)/critical(3)。
#
# 触发方式：
#   mock_event  : 模拟 Agent 在内存中合成事件并发出 trap/inform（默认且唯一自动触发方式）
#   passive     : 仅监听，等待被测端自行上报（live 模式推荐，不产生任何状态变更）
#   snmp_set    : 通过安全 SET 触发；默认禁用，需 explicitly_enabled: true
#   external    : Redfish/IPMI 外部触发；默认禁用且必须显式开启（本框架不实现下发）
version: 1

conventions:
  enterprise_root: 1.3.6.1.4.1.52305
  standard_traps:
    coldStart: 1.3.6.1.6.3.1.1.5.1
    warmStart: 1.3.6.1.6.3.1.1.5.2
    linkDown: 1.3.6.1.6.3.1.1.5.3
    linkUp: 1.3.6.1.6.3.1.1.5.4
    authenticationFailure: 1.3.6.1.6.3.1.1.5.5
  pet_event: 1.3.6.1.4.1.52305.0.1
  severity_map:
    unspecified: 1        # 00h
    monitor: 1            # 01h
    information: 1        # 02h
    ok: 1                 # 04h
    non_critical: 2       # 08h  -> waring(2)
    critical: 3           # 10h  -> critical(3)
    non_recoverable: 3    # 20h  -> critical(3)
  mandatory_varbinds:
    sysUpTime: 1.3.6.1.2.1.1.3.0
    snmpTrapOID: 1.3.6.1.6.3.1.1.4.1.0
    snmpTrapEnterprise: 1.3.6.1.6.3.1.1.4.3.0
    snmpTrapCommunity: 1.3.6.1.6.3.18.1.4.0

expectations:
  - name: cold-start-v1-trap
    pdu_type: trap
    version: v1
    trigger: {type: mock_event, event: coldStart, enabled: true}
    expected_trap_oids: ["1.3.6.1.6.3.1.1.5.1"]
    enterprise_oid: "1.3.6.1.4.1.52305"
    community: private
    varbinds:
      - {oid: "1.3.6.1.6.3.1.1.4.1.0", type: ObjectIdentifier}
      - {oid: "1.3.6.1.6.3.1.1.4.3.0", type: ObjectIdentifier, value: "1.3.6.1.4.1.52305"}
    max_latency_s: 5.0
    expect_ack: false
    tags: [coldstart, v1, generic-trap]

  - name: cold-start-v2c-trap
    pdu_type: trap
    version: v2c
    trigger: {type: mock_event, event: coldStart, enabled: true}
    expected_trap_oids: ["1.3.6.1.6.3.1.1.5.1"]
    enterprise_oid: "1.3.6.1.4.1.52305"
    community: private
    varbinds:
      - {oid: "1.3.6.1.2.1.1.3.0", type: TimeTicks}
      - {oid: "1.3.6.1.6.3.1.1.4.1.0", type: ObjectIdentifier, value: "1.3.6.1.6.3.1.1.5.1"}
      - {oid: "1.3.6.1.6.3.1.1.4.3.0", type: ObjectIdentifier, value: "1.3.6.1.4.1.52305"}
    max_latency_s: 5.0
    expect_ack: false
    tags: [coldstart, v2c]

  - name: cold-start-v3-trap
    pdu_type: trap
    version: v3
    trigger: {type: mock_event, event: coldStart, enabled: true}
    expected_trap_oids: ["1.3.6.1.6.3.1.1.5.1"]
    enterprise_oid: "1.3.6.1.4.1.52305"
    security_name: bmcuser
    varbinds:
      - {oid: "1.3.6.1.6.3.1.1.4.1.0", type: ObjectIdentifier, value: "1.3.6.1.6.3.1.1.5.1"}
      - {oid: "1.3.6.1.6.3.1.1.4.3.0", type: ObjectIdentifier, value: "1.3.6.1.4.1.52305"}
    max_latency_s: 6.0
    expect_ack: false
    tags: [coldstart, v3, usm]

  - name: critical-temperature-v2c-trap
    pdu_type: trap
    version: v2c
    trigger:
      type: mock_event
      event: criticalTemperature
      enabled: true
      # §29.7 Event Request Message 字段（只用于模拟 Agent 构造变量绑定，不下发任何命令）
      ipmi_event:
        evm_rev: 4
        sensor_type: 1          # Temperature (§42 Sensor Type Codes)
        sensor_number: 32
        event_direction: 1      # assertion
        event_type: 1           # threshold
        event_data: [1, 90, 80] # offset / trigger reading / threshold
        severity_code: 0x10     # §17.7 Critical condition
    expected_trap_oids: ["1.3.6.1.4.1.52305.0.1"]
    enterprise_oid: "1.3.6.1.4.1.52305"
    community: private
    severity: 3                 # 映射自 10h Critical -> snmptrapSeverity critical(3)
    varbinds:
      - {oid: "1.3.6.1.2.1.1.3.0", type: TimeTicks}
      - {oid: "1.3.6.1.6.3.1.1.4.1.0", type: ObjectIdentifier, value: "1.3.6.1.4.1.52305.0.1"}
      - {oid: "1.3.6.1.6.3.1.1.4.3.0", type: ObjectIdentifier, value: "1.3.6.1.4.1.52305"}
      - {oid: "1.3.6.1.4.1.52305.2.11.1.2.1", type: Integer32}
      - {oid: "1.3.6.1.4.1.52305.2.11.1.4.1", type: OctetString, contains: "Temp"}
      - {oid: "1.3.6.1.4.1.52305.2.11.1.5.1", type: OctetString}
      - {oid: "1.3.6.1.4.1.52305.2.11.1.7.1", type: OctetString, contains: "Critical"}
    max_latency_s: 5.0
    expect_ack: false
    tags: [pet, pef, v2c, critical]

  - name: critical-temperature-v2c-inform
    pdu_type: inform
    version: v2c
    trigger: {type: mock_event, event: criticalTemperature, enabled: true}
    expected_trap_oids: ["1.3.6.1.4.1.52305.0.1"]
    enterprise_oid: "1.3.6.1.4.1.52305"
    community: private
    severity: 3
    varbinds:
      - {oid: "1.3.6.1.6.3.1.1.4.1.0", type: ObjectIdentifier}
      - {oid: "1.3.6.1.4.1.52305.2.11.1.7.1", type: OctetString, contains: "Critical"}
    max_latency_s: 5.0
    expect_ack: true            # §30.8 PET acknowledge / SNMP inform response
    tags: [pet, inform, ack, v2c]

  - name: critical-temperature-v3-inform
    pdu_type: inform
    version: v3
    trigger: {type: mock_event, event: criticalTemperature, enabled: true}
    expected_trap_oids: ["1.3.6.1.4.1.52305.0.1"]
    enterprise_oid: "1.3.6.1.4.1.52305"
    security_name: bmcuser
    severity: 3
    varbinds:
      - {oid: "1.3.6.1.6.3.1.1.4.1.0", type: ObjectIdentifier}
      - {oid: "1.3.6.1.4.1.52305.2.11.1.7.1", type: OctetString, contains: "Critical"}
    max_latency_s: 6.0
    expect_ack: true
    tags: [pet, inform, ack, v3, usm]
