# Web 服务配置模板。复制为 config/web.yaml 后按需修改；含明文凭据的版本不要提交。
#
# 账号体系（参数内置，不在此文件配置）：
#   注册：邮箱 + 邮箱验证码 + 密码（至少 8 位）
#   登录：密码登录，或邮箱验证码登录
#   权限：所有注册账号完全一致（无角色区分）
#   数据：work/auth.db（SQLite：用户、验证码、会话）
#   邮件：SMTP 通过环境变量配置，未配置时验证码写入 work/mail-dev.log
#         并直接显示在登录页（开发模式）
#
#   SNMP_TEST_SMTP_HOST / SNMP_TEST_SMTP_PORT / SNMP_TEST_SMTP_USER
#   SNMP_TEST_SMTP_PASSWORD / SNMP_TEST_SMTP_FROM / SNMP_TEST_SMTP_TLS

# 内网部署：live 目标默认可达，不设 allow_live / 白名单等前置门槛。
# 所有交互式 SNMP 操作（含 SET 值）写入 work/probe-audit.jsonl，按账号溯源；
# 凭据不写入审计日志。批量任务仍只跑只读 GET。

# 说明：
#  - MIB 库所有账号共享；任务队列按账号隔离，只能看到自己的任务与报告。
#  - 目标端口、SNMP 版本、团体字 / v3 凭据在任务提交时内存传入，不写入本文件。
#  - 串行执行（单 worker），模拟 Agent 用 11811、trap 监听 11812。
#  - 报告输出到 runs/web-<job_id>/，仅任务所有者可访问。
