# Web 服务配置模板。复制为 config/web.yaml 后按需修改；含明文凭据的版本不要提交。
#
# 账号体系（参数内置，不在此文件配置）：
#   注册：邮箱 + 邮箱验证码 + 密码（至少 8 位）
#   登录：密码登录，或邮箱验证码登录
#   权限：所有注册账号完全一致（无角色区分）
#   数据：work/auth.db（SQLite：用户、验证码、会话）
#   邮件：SMTP 可在下方 mail 段配置，也可用 SNMP_TEST_SMTP_* 环境变量（优先）；
#         未配置时验证码写入 work/mail-dev.log 并直接显示在登录页（开发模式）
#
#   SNMP_TEST_SMTP_HOST / SNMP_TEST_SMTP_PORT / SNMP_TEST_SMTP_USER
#   SNMP_TEST_SMTP_PASSWORD / SNMP_TEST_SMTP_FROM / SNMP_TEST_SMTP_TLS / SNMP_TEST_SMTP_SSL

# 内网部署：live 目标默认可达，不设 allow_live / 白名单等前置门槛。
# 所有交互式 SNMP 操作（含 SET 值）写入 work/probe-audit.jsonl，按账号溯源；
# 凭据不写入审计日志。批量任务仍只跑只读 GET。
#
# 需要收紧时，把下面这段复制到 config/web.yaml（列出的即默认值）：
# security:
#   web:
#     allow_live: true            # false 禁止所有 live 探测
#     allowed_targets: []         # 非空时仅允许列出的目标 IP
#     readonly_only: false        # true 禁止所有 SET
#     live_set_enabled: true      # false 禁止 live SET（mock SET 仍可用）
#     hard_block_enabled: true    # live SET 应用 safety-policy.yaml 的硬阻断
# 旧的顶层 security.allow_live / allowed_targets 与 auth.users 属于历史模板，不再读取。
# 被策略拒绝的操作也写入审计（policy_denied）。

# 邮件（可选；环境变量 SNMP_TEST_SMTP_* 优先级最高）。
# 登录后「邮件设置」页面保存到 work/mail.yaml，优先级高于本文件这段配置。
# 含明文密码的 config/web.yaml 不要提交到仓库。
# mail:
#   host: smtp.example.com
#   port: 587
#   user: no-reply@example.com
#   password: "change-me"
#   sender: no-reply@example.com
#   tls: true                   # 非 SSL 端口默认 STARTTLS
#   ssl: false                  # true 时直接 SMTPS

# SNMP 超时：timeout_s 是每次尝试的超时，最坏耗时约为 timeout_s × (retries + 1)。
# 批量任务：
# jobs:
#   timeout_s: 5                # 单次请求超时（秒）
#   retries: 2                  # 超时后的重试次数
#
# 交互探测（MIB 浏览器 / 探测面板）的吞吐、连接复用与超时：
# 会话按「目标 + SNMP 版本 + 凭据」缓存复用，WALK 在 v2c/v3 下用 GETBULK 批量拉取。
# probe:
#   timeout_s: 5                # 单次请求超时（秒）
#   retries: 1                  # 偶发丢包时重发一次；0 = 不重试
#   concurrency: 4              # live 探测最大并发请求数
#   rate_limit_ms: 20           # 同一目标两次请求的最小间隔（毫秒），也作用于 WALK 内部；0 = 不限速
#   session_ttl_s: 300          # 空闲会话保留时间，超时后关闭
#   session_cache_size: 16      # 最多缓存的会话数，超出按 LRU 关闭最久未用的

# 说明：
#  - MIB 库所有账号共享；任务队列按账号隔离，只能看到自己的任务与报告。
#  - 目标端口、SNMP 版本、团体字 / v3 凭据在任务提交时内存传入，不写入本文件。
#  - 默认 2 个 worker（SNMP_TEST_WEB_WORKERS，上限 4），同一 live 目标串行；
#    模拟 Agent 用 11811 + slot*10、trap 监听 11812 + slot*10。
#  - 报告输出到 runs/web-<job_id>/，仅任务所有者可访问。
